name: CI/CD for Face Recognition App

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:20.10.21
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push app image
        uses: docker/build-push-action@v2
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app:latest

      - name: Build and push face embedding image
        uses: docker/build-push-action@v2
        with:
          context: ./face_embedding
          file: ./face_embedding/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/face_embedding:latest

      - name: Build and push multi-container app using docker-compose
        run: docker-compose -f docker-compose.yml build

  deploy_production:
    if: github.ref == 'refs/heads/main'
    # needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to remote server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          export PATH=$PATH:/home/bbsw/.local/bin
          export PYTHONPATH=$PYTHONPATH:/home/bbsw/.local/lib/python3.6/site-packages
          cd /home/bbsw/Face_Recognition_JetNano
          git checkout -- autoOPENapp.sh
          git pull https://{{ secrets.PASSWORD_TOKEN_GITHUB }}@github.com/Bluebolt-Software-AI-LAB/Face_Recognition_JetNano.git main
          docker-compose down
          docker-compose pull
          docker-compose up -d --build
          chmod 777 autoOPENapp.sh
          sudo sync && sudo sysctl -w vm.drop_caches=3