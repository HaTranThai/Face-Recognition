# version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-container
    networks:
      - network_face
    ports:
      - "127.0.0.1:6333:6333"
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
      - ./snapshots:/qdrant/snapshots

  api_db:
    build: ./app/
    container_name: api_db-container
    networks:
      - network_face
    ports:
      - "127.0.0.1:7005:7005"
    restart: always
    volumes:
      - ./app:/app
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "7005", "--workers", "2"]
    depends_on:
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - FASTAPI_PORT=7005
  
  api_fr:
    build: ./face_embedding/
    container_name: api_fr-container
    networks:
      - network_face
    ports:
      - "2024:2024"
    restart: always
    volumes:
      - ./face_embedding:/face_embedding
      - ./snapshots:/face_embedding/snapshots
    command: ["uvicorn", "face:app", "--host", "0.0.0.0", "--port", "2024", "--workers", "2"]
    depends_on:
      - qdrant
      - api_db
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - FASTAPI_HOST=api_db
      - FASTAPI_PORT=7005
      - FACE_PORT=2024

  minio:
    image: minio/minio:latest
    container_name: minio_container
    restart: always
    ports:
      - "9000:9000" 
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: minioadmin 
      MINIO_ROOT_PASSWORD: minioadmin1245 
    command: server /data --console-address ":9001"
    volumes:
      - ./data/miniodata:/data
    networks:
      - network_face

volumes:
  qdrant_data:

networks:
  network_face:
    driver: bridge
